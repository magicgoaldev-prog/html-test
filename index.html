<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ананасовый улун — Teaboom.ru</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="page">
    <article class="product">
      <div class="product__top">
        <figure class="product__media">
          <img
            src="assets/product.jpg"
            alt="Ананасовый улун"
            width="800"
            height="800"
          >
        </figure>

        <div class="product__info">
          <p class="product__category">Ароматизированный</p>
          <h1 class="product__title">Ананасовый улун</h1>
          <p class="product__sku">арт. <span data-sku>01306</span></p>

          <div class="product__packs" role="group" aria-label="Фасовка">
            <button type="button" class="pack is-active" data-weight="100 г" aria-pressed="true">100 г</button>
            <button type="button" class="pack" data-weight="500 г" aria-pressed="false">500 г</button>
            <button type="button" class="pack" data-weight="1000 г" aria-pressed="false">1000 г</button>
            <button type="button" class="pack" data-weight="5000 г" aria-pressed="false">5000 г</button>
          </div>

          <div class="product__pricing">
            <span class="product__price" data-price>326,40 ₽</span>
            <s class="product__old" data-old-price>349,20 ₽</s>
          </div>

          <button type="button" class="product__cart">В корзину</button>
        </div>
      </div>

      <div class="product__desc">
        <h2 class="product__desc-title">Вкус</h2>
        <p>
          Настой прозрачный, светло-янтарного цвета.
          Классическая нота светлого фуцзяньского улуна переплетается c яркой ананасовой нотой.
        </p>
      </div>
    </article>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
